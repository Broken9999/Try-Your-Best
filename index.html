<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hard Quiz</title>
  <style>
    :root {
      --maxw: 1100px;
      --pad: 20px;
      --radius: 18px;
      --shadow: 0 12px 30px rgba(0,0,0,.25);
      --iframe-h: min(80vh, 800px);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: #0f172a;
      background: radial-gradient(1200px 600px at 10% 10%, #dbeafe 0, #e9d5ff 35%, #fef3c7 70%, #ffffff 100%);
      background-attachment: fixed;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: var(--maxw);
      padding: clamp(16px, 2.5vw, 28px);
    }
    header {
      text-align: center;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.6rem, 3.2vw, 2.4rem);
    }
    .sub {
      margin: 0;
      opacity: .8;
    }
    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: clip;
    }
    nav {
      display: flex;
      gap: 10px;
      padding: var(--pad);
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #e5e7eb;
    }
    .tab {
      appearance: none;
      border: 0;
      background: #f1f5f9;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    }
    .tab:hover { transform: translateY(-1px); }
    .tab[aria-selected="true"] {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 6px 18px rgba(59,130,246,.35);
    }

    .stage {
      padding: 0;
    }
    .frameWrap {
      position: relative;
      width: 100%;
      height: var(--iframe-h);
      background: linear-gradient(180deg,#f8fafc,#eef2ff);
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .helper {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.95));
      font-size: .95rem;
    }
    .helper a { color: #2563eb; font-weight: 700; text-decoration: none; }
    .helper a:focus, .helper a:hover { text-decoration: underline; }

    .sr {
      position: absolute !important;
      width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .fadeIn { animation: fade .5s ease both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="fadeIn">
      <h1>🎯 Choose Your Quiz</h1>
      <p class="sub">Pick an option below. If an embed is blocked by the provider, use the <strong>Open in new tab</strong> link that appears.</p>
    </header>

    <section class="card fadeIn" aria-label="Quiz chooser">
      <nav role="tablist" aria-label="Quiz options">
        <button id="tab-wayground" class="tab" role="tab" aria-selected="false" data-key="wayground">🚀 Wayground</button>
        <button id="tab-quizizz" class="tab" role="tab" aria-selected="true" data-key="quizizz">🧩 Quizizz</button>
      </nav>

      <div class="stage">
        <div class="frameWrap" id="frameWrap">
          <iframe id="quizFrame"
            title="Quiz embed"
            allow="fullscreen; geolocation; microphone; camera; clipboard-read; clipboard-write; autoplay; encrypted-media"
            referrerpolicy="no-referrer-when-downgrade"
            src="about:blank"
          ></iframe>
          <div class="helper" id="helper" hidden>
            <span>Having trouble? This site may block embedding.</span>
            <a id="openLink" href="#" target="_blank" rel="noopener">Open in new tab</a>
          </div>
        </div>
      </div>
    </section>
  </div>

  <noscript>
    <p style="padding: 1rem; text-align:center;">JavaScript is required to switch between quizzes. Open directly:
      <a href="https://wayground.com/embed/quiz/68a312cd2460d4da95adee27">Wayground</a> ·
      <a href="https://quizizz.com/embed/quiz/66cc2e967b4cc9b2fbc7831a">Quizizz</a></p>
  </noscript>

  <script>
    const QUIZZES = {
      wayground: {
        url: 'https://wayground.com/embed/quiz/68a312cd2460d4da95adee27',
        label: 'Wayground Quiz'
      },
      quizizz: {
        url: 'https://quizizz.com/embed/quiz/66cc2e967b4cc9b2fbc7831a',
        label: 'Quizizz Quiz'
      }
    };

    const frame = document.getElementById('quizFrame');
    const helper = document.getElementById('helper');
    const openLink = document.getElementById('openLink');
    const tabs = Array.from(document.querySelectorAll('.tab'));

    function setActive(key) {
      // Update tab UI
      tabs.forEach(btn => btn.setAttribute('aria-selected', String(btn.dataset.key === key)));

      // Load iframe
      const { url, label } = QUIZZES[key];
      frame.title = label;
      frame.src = url;
      openLink.href = url;

      // Show helper after a short delay if the frame doesn't visually change size
      helper.hidden = true;
      // We cannot reliably detect frame-ancestor blocking, so show a gentle helper after delay
      clearTimeout(setActive._t);
      setActive._t = setTimeout(() => {
        // If frame is still about:blank OR if provider blocked, the user likely sees an error/blank
        // We hint the fallback link regardless
        try {
          // Accessing cross-origin will throw. That's fine—we still show helper.
          void frame.contentWindow; 
        } catch (e) {}
        helper.hidden = false;
      }, 1500);

      // Reflect selection in URL hash for deep-linking
      history.replaceState(null, '', '#' + key);
    }

    // Click handlers
    tabs.forEach(btn => {
      btn.addEventListener('click', () => setActive(btn.dataset.key));
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          setActive(btn.dataset.key);
        }
      });
    });

    // Load from hash if present, default to quizizz (more likely to allow embeds)
    const startKey = (location.hash || '').replace('#','');
    setActive(QUIZZES[startKey] ? startKey : 'quizizz');
  </script>
</body>
</html>
